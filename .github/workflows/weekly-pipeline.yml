name: Biweekly Research Archive & Magazine Pipeline

# 발행 주기: 2주에 한 번 (수요일 09:00 KST)
# GitHub 예약 실행(cron)은 "2주마다"를 직접 표현할 수 없어서 매주 수요일에 실행한 뒤,
# 마지막 호 발행 후 13일이 안 지났으면 건너뜁니다.
# 수동 실행(Actions 탭 → Run workflow)은 이 검사 없이 바로 발행합니다.
on:
  schedule:
    - cron: '0 0 * * 3'   # 매주 수요일 UTC 00:00 = KST 09:00
  workflow_dispatch:
    inputs:
      force:
        description: '2주 주기와 상관없이 지금 발행'
        type: boolean
        default: true

permissions:
  contents: write   # 아카이브·빌드 결과를 커밋 & 푸시

concurrency:
  group: research-pipeline
  cancel-in-progress: false

jobs:
  archive-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 발행 주기 확인 (마지막 호 + 13일)
        id: gate
        run: |
          LAST=$(ls archives/*.md 2>/dev/null | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort | tail -1)
          TODAY=$(date -u +%Y-%m-%d)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" != "false" ]; then
            echo "수동 실행 → 바로 발행합니다. (마지막 호: ${LAST:-없음})"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$LAST" ]; then
            echo "기존 호 없음 → 발행합니다."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            DAYS=$(( ( $(date -u -d "$TODAY" +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
            echo "마지막 호 ${LAST}, ${DAYS}일 경과"
            if [ "$DAYS" -ge 13 ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "2주가 안 지나 이번 주는 건너뜁니다."
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: 파이썬 환경 설정 (3.11)
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 설치
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: 논문 수집 · 요약 · 마크다운 아카이브 생성
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 선택: 저장소 Settings → Variables 에서 바꿀 수 있음 (비어 있으면 코드 기본값)
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          AI_PROVIDER: gemini
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::GEMINI_API_KEY 시크릿이 없습니다. AI 요약 대신 초록 문장 추출로 대체됩니다."
          fi
          python scripts/fetch_and_archive.py

      - name: 사이트 빌드 (최근 3개 호)
        if: steps.gate.outputs.run == 'true'
        run: python scripts/build_site.py

      - name: 변경사항 커밋 & 푸시
        if: steps.gate.outputs.run == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # 아카이브 · 사이트 · 수집 상태(KCI 기준일, 기발행 논문 목록) · 요약 캐시
          git add archives/ public/ data/
          if [ -f summary_cache.json ]; then git add summary_cache.json; fi

          if git diff --staged --quiet; then
            echo "변경사항이 없습니다."
          else
            git commit -m "chore(archive): automated biweekly digest for $(date -u +%Y-%m-%d) [skip ci]"
            # 실행 중에 다른 커밋이 올라왔을 수 있으므로 rebase 후 푸시
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "푸시 완료 → Vercel 이 자동 배포합니다."
          fi
