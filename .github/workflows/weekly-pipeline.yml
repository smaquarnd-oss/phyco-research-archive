name: Weekly Research Archive & Magazine Pipeline

on:
  schedule:
    # 매주 수요일 UTC 00:00 (한국 시간 수요일 오전 09:00 KST)
    - cron: '0 0 * * 3'
  workflow_dispatch: # GitHub 웹 UI에서 수동 즉시 실행 가능

permissions:
  contents: write # 아카이브 파일 및 빌드 결과를 Git에 커밋 & 푸시하기 위한 권한

jobs:
  archive-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃 (Checkout Repository)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 환경 설정 (Setup Python 3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 의존성 패키지 설치 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 최신 연구 논문 수집 및 마크다운 아카이브 생성 (Fetch & Archive)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/fetch_and_archive.py

      - name: 정적 웹진 블로그 재빌드 (Build Magazine Site)
        run: |
          python scripts/build_site.py

      - name: 변경사항 커밋 및 푸시 (Commit and Push Changes)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # 변경사항 확인
          git add archives/ public/
          
          if git diff --staged --quiet; then
            echo "새로 변경되거나 추가된 논문 아카이브가 없습니다. 건너뜁니다."
          else
            TIMESTAMP=$(date +'%Y-%m-%d')
            git commit -m "chore(archive): automated weekly digest for ${TIMESTAMP} [skip ci]"
            git push origin HEAD:${{ github.ref }}
            echo "성공적으로 GitHub 저장소에 푸시되었습니다. Vercel이 새 버전을 자동 배포합니다."
          fi
